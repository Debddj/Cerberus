[project]
name = "cerberus-firewall"
version = "0.1.0"
description = "A runtime behavioral firewall for MCP-based autonomous AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Debnil", email = "debnil@example.com" }
]
dependencies = [
    "mcp>=1.28.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "prometheus-client>=0.21.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.4",
    "joblib>=1.4.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/cerberus"]
