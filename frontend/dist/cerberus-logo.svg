<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none">
  <defs>
    <radialGradient id="haloGrad" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FFF9EB" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#E9E2FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#DCD5FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="furDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4D9B" />
      <stop offset="100%" stop-color="#2D235C" />
    </linearGradient>
    <linearGradient id="furMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C7BFA" />
      <stop offset="100%" stop-color="#4A3B8F" />
    </linearGradient>
    <linearGradient id="furLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F1EEFF" />
      <stop offset="65%" stop-color="#C7BDFC" />
      <stop offset="100%" stop-color="#7B6AC7" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F4F1FF" />
      <stop offset="48%" stop-color="#B9AEF7" />
      <stop offset="100%" stop-color="#6E5EE0" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2F84" />
      <stop offset="100%" stop-color="#1E1848" />
    </linearGradient>
  </defs>

  <circle cx="120" cy="96" r="90" fill="url(#haloGrad)" />

  <!-- Chest & Shoulder Mantle -->
  <path d="M54 148 L72 108 L168 108 L186 148 L152 178 L88 178 Z" fill="url(#furDark)" />
  <path d="M62 142 L80 116 L160 116 L178 142 L154 166 L86 166 Z" fill="url(#furMid)" />

  <!-- LEFT GUARDIAN HEAD -->
