name: Cerberus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          uv run ruff check src/ tests/ evaluation/ sandbox/
          uv run ruff format --check src/ tests/ evaluation/ sandbox/

      - name: Run Mypy Typecheck
        run: |
          uv run mypy src/

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Test Rego Policies
        run: |
          opa test policies/ -v

      - name: Run Complete Test Suite (Unit, Integration, E2E, Fuzz, MCP Conformance)
        run: |
          uv run pytest tests/ -v --cov=src/cerberus --cov-report=xml

      - name: Verify Empirical Ablation Study
        run: |
          uv run python evaluation/run_ablation.py --check

      - name: Verify Adversarial Robustness Evaluation
        run: |
          uv run python evaluation/run_adversarial_eval.py

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
